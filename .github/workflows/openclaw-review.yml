name: OpenClaw PR Review (Local)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted # <-- Điểm mấu chốt ở đây
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Chạy OpenClaw Review
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCLAW_PAT }} 
          # Không cần truyền LLM_API_KEY ở đây nữa, OpenClaw sẽ tự lấy từ máy bạn
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          
          # Chạy openclaw agent và gom toàn bộ kết quả trả về
          OUTPUT=$(openclaw agent --message "Vui lòng đọc code và review GitHub Pull Request này: $PR_URL. Chỉ đưa ra nhận xét chuyên môn.")
          
          {
            echo 'review_result<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Đăng comment kết quả lên PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENCLAW_PAT }}
          script: |
            const reviewBody = `🤖 **OpenClaw PR Review:**\n\n${{ steps.openclaw-step.outputs.review_result }}`;
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });
