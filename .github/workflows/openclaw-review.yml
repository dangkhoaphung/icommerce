name: OpenClaw PR Review (Local)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted # <-- Điểm mấu chốt ở đây
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Chạy OpenClaw Review
        id: openclaw-step
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCLAW_PAT }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          
          # Test in ra terminal xem openclaw trả về gì
          echo "Bắt đầu gọi openclaw..."
          OUTPUT=$(openclaw agent --message "Review PR này: $PR_URL")
          echo "Output nhận được là: $OUTPUT"
          
          {
            echo 'review_result<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Đăng comment kết quả lên PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENCLAW_PAT }}
          script: |
            const reviewBody = `🤖 **OpenClaw PR Review:**\n\n${{ steps.openclaw-step.outputs.review_result }}`;
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });
